name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Lint with ruff
        run: ruff check src/

      - name: Compile check
        run: python -m compileall -q src

      - name: Smoke import test
        run: |
          python -c "import src.config, src.webasyst_api, src.llm_client, src.poster, src.validator, src.scanner, src.pipeline, src.report, src.make_report; print('IMPORT_OK')"
